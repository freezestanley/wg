<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>WebGen Design Review</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f0e8;
      color: #1f1b16;
    }
    .shell {
      max-width: 1220px;
      margin: 0 auto;
      display: grid;
      gap: 20px;
    }
    .hero {
      padding: 24px 28px;
      border-radius: 24px;
      background: linear-gradient(135deg, #fffaf1, #efe5d2);
      border: 1px solid rgba(83, 61, 28, 0.12);
    }
    .hero strong {
      display: block;
      font-size: 28px;
      line-height: 1.1;
      margin-bottom: 8px;
    }
    .hero p {
      margin: 0;
      color: #5e5140;
      font-size: 15px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }
    .card {
      padding: 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(83, 61, 28, 0.12);
      box-shadow: 0 10px 30px rgba(31, 27, 22, 0.08);
    }
    .card header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      letter-spacing: 0.04em;
      margin-bottom: 12px;
      color: #5e5140;
    }
    .frame {
      border-radius: 16px;
      overflow: hidden;
      background: #f8f4ec;
      border: 1px solid rgba(83, 61, 28, 0.08);
      display: grid;
      place-items: center;
      min-height: 280px;
    }
    .frame img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      background: white;
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <strong>WebGen CDP Design Review</strong>
      <p>http://127.0.0.1:4175/</p>
    </section>
    <section class="grid">
    <article class="card">
      <header>
        <strong>PC</strong>
        <span>1440 x 900</span>
      </header>
      <div class="frame">
        <img src="file:///Users/za-stanlexu/.openclaw/agents/webgen/workspace/templates/vite-page/scaffold/.webgen/artifacts/design-review/pc.jpg" alt="pc" />
      </div>
    </article>
  
    <article class="card">
      <header>
        <strong>PAD</strong>
        <span>834 x 1194</span>
      </header>
      <div class="frame">
        <img src="file:///Users/za-stanlexu/.openclaw/agents/webgen/workspace/templates/vite-page/scaffold/.webgen/artifacts/design-review/pad.jpg" alt="pad" />
      </div>
    </article>
  
    <article class="card">
      <header>
        <strong>H5</strong>
        <span>390 x 844</span>
      </header>
      <div class="frame">
        <img src="file:///Users/za-stanlexu/.openclaw/agents/webgen/workspace/templates/vite-page/scaffold/.webgen/artifacts/design-review/h5.jpg" alt="h5" />
      </div>
    </article>
  </section>
  </main>
</body>
</html>
